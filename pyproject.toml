[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "error-analysis"
version = "0.1.0"
description = "Fetch RequestLogPayload from Datadog logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
error-analysis = "error_analysis.cli:app"
error-analysis-api = "error_analysis.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/error_analysis"]

[tool.hatch.build.targets.wheel.sources]
"src/error_analysis" = "error_analysis"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
